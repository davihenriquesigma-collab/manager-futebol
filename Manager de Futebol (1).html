<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>Manager de Futebol</title>
<style>
  :root {
    --bg1: #0a1628; --bg2: #0f2440;
    --card: rgba(255,255,255,0.045); --card2: rgba(255,255,255,0.08);
    --line: rgba(34,211,238,0.18);
    --txt: #e8f1fb; --grey: #7f93ad;
    --cyan: #22d3ee; --gold: #fbbf24; --green: #34d399; --red: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, #14365e 0%, var(--bg1) 60%) fixed, var(--bg1);
    color: var(--txt); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }

  /* Cabeçalho */
  header {
    position: sticky; top: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px;
    background: linear-gradient(180deg, rgba(10,22,40,0.97), rgba(10,22,40,0.85));
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .topo { display: flex; align-items: center; gap: 12px; }
  .escudo {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 44px; display: grid; place-items: center;
    font-weight: 800; font-size: 13px; letter-spacing: .5px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 4px 14px rgba(0,0,0,.35);
  }
  .titulo { flex: 1; min-width: 0; }
  .titulo h1 { margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titulo small { color: var(--grey); font-size: 12px; }
  .chip {
    background: rgba(34,211,238,.12); color: var(--cyan); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .caixa { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--grey); }
  .barra { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
  .barra > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); border-radius: 99px; }

  /* Conteúdo */
  main { padding: 14px; max-width: 880px; margin: 0 auto; }
  .secao { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 12px; }
  .secao h2 { margin: 0; font-size: 18px; }
  .secao span { color: var(--grey); font-size: 12px; }
  .grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .grade { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 920px) { .grade { grid-template-columns: repeat(4, 1fr); } }

  /* Cartão de jogador */
  .jog {
    background: linear-gradient(160deg, var(--card2), var(--card)); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .jog:active { transform: scale(.98); }
  .jog:hover { border-color: var(--cyan); }
  .jog-topo { display: flex; align-items: center; justify-content: space-between; }
  .pos { font-size: 11px; font-weight: 700; color: var(--cyan); background: rgba(34,211,238,.1); border-radius: 6px; padding: 3px 7px; }
  .nota {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #05121f;
  }
  .nota.top { background: linear-gradient(135deg, #fde68a, var(--gold)); }
  .nota.bom { background: linear-gradient(135deg, #a7f3d0, var(--green)); }
  .nota.medio { background: linear-gradient(135deg, #bae6fd, var(--cyan)); }
  .nota.fraco { background: linear-gradient(135deg, #e2e8f0, #94a3b8); }
  .jog strong { font-size: 14px; line-height: 1.2; }
  .jog .sal { font-size: 12px; color: var(--grey); }

  /* Tabela */
  .tab { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tab-l { display: grid; grid-template-columns: 30px 1fr 36px 44px 44px; gap: 6px; align-items: center;
    padding: 11px 12px; font-size: 14px; border-top: 1px solid rgba(255,255,255,.05); }
  .tab-l:first-child { border-top: 0; }
  .tab-l.head { color: var(--grey); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
  .tab-l.eu { background: rgba(34,211,238,.09); }
  .tab-l .p { text-align: right; color: var(--gold); font-weight: 800; }
  .tab-l .n { text-align: right; }
  .pos-n { font-weight: 800; color: var(--grey); }
  .pos-n.t3 { color: var(--gold); }
  .nome-clube { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
  .nome-clube .escudo { width: 26px; height: 26px; flex-basis: 26px; font-size: 9px; box-shadow: none; }
  .nome-clube span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Escolha de time */
  .clube {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; margin-bottom: 10px;
    background: linear-gradient(160deg, var(--card2), var(--card)); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px;
  }
  .clube .info { flex: 1; min-width: 0; }
  .clube strong { display: block; font-size: 16px; }
  .clube small { color: var(--grey); font-size: 12px; }
  .forca-barra { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .forca-barra > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); }

  /* Barra inferior */
  nav.inferior {
    position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 8px 8px;
    background: rgba(12,28,52,.84); border: 1px solid var(--line); border-radius: 24px;
    backdrop-filter: blur(14px); box-shadow: 0 14px 34px rgba(0,0,0,.5); max-width: 520px; margin: 0 auto;
  }
  nav.inferior button {
    flex: 1; background: transparent; border-radius: 16px; padding: 6px 2px 4px; min-height: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; color: var(--grey); transition: color .2s ease, transform .15s ease;
  }
  nav.inferior button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; transition: filter .2s ease; }
  nav.inferior button.on { color: var(--cyan); }
  nav.inferior button.on svg { filter: drop-shadow(0 0 6px rgba(34,211,238,.75)); }
  nav.inferior button:active { transform: scale(.92); }
  nav.inferior button.avancar { flex: 0 0 auto; width: 84px; color: var(--txt); font-weight: 600; }
  nav.inferior .bolha {
    width: 56px; height: 56px; margin-top: -30px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #34d399, #0ea5e9); box-shadow: 0 10px 26px rgba(52,211,153,.45);
    border: 4px solid rgba(10,22,40,.95);
  }
  nav.inferior .bolha svg { fill: #05121f; stroke: none; width: 20px; height: 20px; margin-left: 3px; }

  /* Entrada animada do conteúdo */
  #conteudo.anima > * { animation: entra .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  header { position: sticky; }
  header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--green), transparent); opacity: .7;
  }

  /* Modal (detalhes do jogador) */
  .fundo { position: fixed; inset: 0; background: rgba(2,8,18,.7); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .fundo.aberto { display: flex; }
  .folha {
    width: 100%; max-width: 520px; background: linear-gradient(180deg, #13294a, #0c1d36);
    border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    animation: sobe .18s ease-out;
  }
  @media (min-width: 700px) { .fundo { align-items: center; } .folha { border-radius: 20px; } }
  @keyframes sobe { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .folha-topo { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .folha-topo .nota { width: 56px; height: 56px; font-size: 22px; border-radius: 16px; }
  .folha-topo h3 { margin: 0; font-size: 18px; }
  .folha-topo small { color: var(--grey); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stats div { background: var(--card); border-radius: 10px; padding: 10px; font-size: 12px; color: var(--grey); }
  .stats b { display: block; color: var(--txt); font-size: 15px; margin-top: 2px; }
  .botoes { display: grid; gap: 8px; }
  .botoes button { border-radius: 12px; padding: 13px; font-weight: 600; background: var(--card2); }
  .botoes button.primario { background: linear-gradient(135deg, var(--cyan), #0ea5e9); color: #05121f; }
  .botoes button.ouro { background: linear-gradient(135deg, #fde68a, var(--gold)); color: #1f1600; }
  .botoes button.perigo { background: rgba(248,113,113,.15); color: var(--red); }
  .botoes button.fechar { background: transparent; color: var(--grey); }
  .dica { font-size: 12px; color: var(--grey); margin: 0 0 4px; }

  /* Aviso */
  .toast {
    position: fixed; top: calc(118px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    background: rgba(12,29,54,.96); border: 1px solid var(--line); color: var(--txt);
    padding: 10px 14px; border-radius: 12px; font-size: 13px; max-width: calc(100% - 28px); z-index: 15;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; text-align: center;
  }
  .toast.on { display: block; }
  .nota-rodape { color: var(--grey); font-size: 11px; text-align: center; margin: 14px 0 0; }
  .escudo-img { width: 44px; height: 44px; flex: 0 0 44px; object-fit: contain; background: #ffffff; border-radius: 10px; padding: 4px; box-sizing: border-box; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .nome-clube .escudo-img { width: 28px; height: 28px; flex-basis: 28px; padding: 2px; border-radius: 6px; box-shadow: none; }
  .clube .escudo-img { width: 50px; height: 50px; flex-basis: 50px; border-radius: 12px; }
  /* Escalação */
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; background: transparent; color: var(--grey); padding: 9px 6px; border-radius: 9px; min-height: 0; }
  .seg button.on { background: linear-gradient(135deg, var(--cyan), #0ea5e9); color: #05121f; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--txt); font-size: 13px; min-height: 0; flex: 0 0 auto; }
  .chip.on { background: var(--cyan); color: #05121f; font-weight: 700; }
  .campo {
    position: relative; width: 100%; max-width: 420px; aspect-ratio: 3 / 4; margin: 0 auto 14px; border-radius: 16px; overflow: hidden;
    border: 2px solid rgba(255,255,255,.75);
    background: repeating-linear-gradient(180deg, #1d7a3c 0 12.5%, #22883f 12.5% 25%);
    box-shadow: inset 0 0 40px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.4);
  }
  .campo::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid rgba(255,255,255,.6); }
  .campo::after { content: ""; position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border: 2px solid rgba(255,255,255,.6); border-radius: 50%; }
  .pino { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 92px; z-index: 2; }
  .bolinha { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #05121f;
    font-size: 14px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.45); }
  .bolinha.top { background: linear-gradient(135deg, #fde68a, var(--gold)); }
  .bolinha.bom { background: linear-gradient(135deg, #a7f3d0, var(--green)); }
  .bolinha.medio { background: linear-gradient(135deg, #bae6fd, var(--cyan)); }
  .bolinha.fraco { background: linear-gradient(135deg, #e2e8f0, #94a3b8); }
  .pino span { font-size: 10px; line-height: 1.15; color: #fff; background: rgba(0,0,0,.55); padding: 2px 5px; border-radius: 8px; text-align: center; max-width: 92px; word-break: break-word; }
  .banco-item { display: grid; grid-template-columns: 40px 1fr 36px; gap: 8px; padding: 9px 12px; background: var(--card);
    border-radius: 10px; margin-bottom: 6px; font-size: 13px; align-items: center; }
  .banco-item span:first-child { color: var(--cyan); font-weight: 700; }
  .banco-item b { text-align: right; color: var(--gold); }
  /* Partidas */
  .jogo { text-align: center; }
  .versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 6px 0 14px; }
  .versus .lado { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .versus .lado strong { font-size: 14px; line-height: 1.2; }
  .versus .lado small { color: var(--grey); font-size: 12px; }
  .versus .x { font-weight: 800; color: var(--gold); font-size: 18px; }
  .barra-comp { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; height: 8px; margin: 4px 0 14px; }
  .barra-comp > i { display: block; border-radius: 99px; }
  .destaques { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .destaques h4 { margin: 0 0 6px; font-size: 13px; color: var(--grey); font-weight: 600; }
  .destaques div div { font-size: 13px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.06); display: flex; justify-content: space-between; gap: 6px; }
  .destaques div div b { color: var(--gold); }
  .res { display: grid; grid-template-columns: 56px 1fr 56px 36px; gap: 8px; align-items: center; padding: 10px 12px;
    background: var(--card); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
  .res .r { font-weight: 800; text-align: center; border-radius: 8px; padding: 4px 0; color: #05121f; }
  .res .r.v { background: var(--green); }
  .res .r.e { background: var(--gold); }
  .res .r.d { background: var(--red); }
  .res .placar { text-align: center; font-weight: 800; }
  .folha .versus .lado .escudo-img { width: 96px; height: 96px; flex-basis: 96px; padding: 8px; border-radius: 16px; }
  .folha .versus .lado .escudo { width: 96px; height: 96px; font-size: 22px; }
  .pre-titulo { text-align: center; color: var(--grey); font-size: 13px; margin-bottom: 4px; }
  .folha .versus { margin: 18px 0 22px; }
  .res.atual { outline: 1px solid var(--cyan); }
  .res .escudo-img { width: 26px; height: 26px; flex-basis: 26px; padding: 2px; border-radius: 6px; box-shadow: none; }
  /* Tela inicial */
  body.inicio header, body.inicio nav.inferior, body.inicio #toast { display: none; }
  body.inicio { padding-bottom: 0; }
  body.semtime header, body.semtime nav.inferior { display: none; }
  .inicio-wrap {
    position: relative; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 28px 20px;
    background: radial-gradient(900px 500px at 50% 0%, #17406e 0%, transparent 60%),
                radial-gradient(700px 400px at 50% 100%, #0b3b2a 0%, transparent 60%);
  }
  .halo {
    position: absolute; top: 50%; left: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,.28), transparent 68%); animation: pulso 6s ease-in-out infinite; pointer-events: none;
  }
  .linhas { position: absolute; inset: 0; opacity: .12; pointer-events: none;
    background-image: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 48px),
                      repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 48px); }
  .titulo-jogo {
    position: relative; font-size: 52px; font-weight: 900; letter-spacing: 3px; line-height: 1;
    background: linear-gradient(90deg, #ffffff, var(--cyan), var(--green)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 22px rgba(34,211,238,.35));
  }
  .sub-jogo { position: relative; letter-spacing: 8px; color: var(--grey); font-size: 12px; margin-top: 8px; text-transform: uppercase; }
  .flutua { position: relative; display: flex; gap: 12px; margin: 34px 0 40px; flex-wrap: wrap; justify-content: center; }
  .flutua .escudo-img, .flutua .escudo { width: 56px; height: 56px; flex: 0 0 56px; animation: flutua 3.2s ease-in-out infinite; }
  .flutua > :nth-child(2) { animation-delay: .5s; }
  .flutua > :nth-child(3) { animation-delay: 1s; }
  .flutua > :nth-child(4) { animation-delay: 1.5s; }
  .flutua > :nth-child(5) { animation-delay: 2s; }
  .botao-jogo {
    position: relative; width: 100%; max-width: 300px; padding: 17px; font-size: 17px; font-weight: 800; border-radius: 18px;
    background: linear-gradient(135deg, var(--green), #0ea5e9); color: #05121f; box-shadow: 0 14px 34px rgba(52,211,153,.35);
    letter-spacing: .5px; margin-bottom: 12px;
  }
  .botao-jogo:active { transform: scale(.97); }
  .botao-sec {
    position: relative; width: 100%; max-width: 300px; padding: 14px; font-size: 15px; border-radius: 16px;
    background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--txt);
  }
  .rodape-jogo { position: relative; margin-top: 26px; font-size: 11px; color: var(--grey); letter-spacing: 1px; }
  @keyframes flutua { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pulso { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.12); opacity: 1; } }
  /* Tela inicial (versão 2) */
  body.inicio main { padding: 0; max-width: none; }
  .ini {
    position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 22px 18px 18px; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, #0c213d 0%, #0a1628 65%);
  }
  .ini::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 60px);
  }
  .ini > * { position: relative; }
  .ini-topo { width: 100%; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1.2px;
    color: var(--grey); text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .ini-titulo { margin-top: 48px; display: flex; flex-direction: column; line-height: .95; }
  .ini-titulo span { font-size: 56px; font-weight: 900; color: #ffffff; letter-spacing: 2px; }
  .ini-titulo b { font-size: 24px; font-weight: 800; letter-spacing: 8px; color: var(--gold); margin-top: 8px; }
  .ini-frase { color: var(--grey); font-size: 14px; margin: 18px 0 28px; max-width: 280px; line-height: 1.4; }
  .ini-card {
    width: 100%; max-width: 340px; padding: 18px; border-radius: 20px;
    background: linear-gradient(160deg, rgba(34,211,238,.10), rgba(255,255,255,.03));
    border: 1px solid var(--line); box-shadow: 0 20px 40px rgba(0,0,0,.4);
  }
  .ini-escudos { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .ini-escudos .escudo-img, .ini-escudos .escudo { width: 44px; height: 44px; flex: 0 0 44px; }
  .ini-principal {
    width: 100%; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; margin-bottom: 10px;
    background: linear-gradient(135deg, var(--gold), #f59e0b); color: #1f1600;
  }
  .ini-sec { width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; color: var(--txt);
    background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .ini-links { margin-top: auto; padding-top: 28px; display: flex; gap: 10px; justify-content: center; }
  .ini-links button { background: transparent; color: var(--grey); font-size: 12px; flex: 0 0 auto; padding: 8px 12px; min-height: 0; }
  /* Menu inicial (estilo pixel com campo) */
  body.inicio main { padding: 0; max-width: none; }
  .mi-tela { position: relative; min-height: 100vh; overflow: hidden; background: #1a6b33; }
  .mi-campo {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 40%, rgba(255,255,255,.06), transparent 60%),
      repeating-linear-gradient(90deg, #1f7a3a 0 56px, #23893f 56px 112px);
  }
  .mi-campo::before {
    content: ""; position: absolute; inset: 14px; border: 3px solid rgba(255,255,255,.75);
  }
  .mi-campo::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 130px; height: 130px;

  .sub-jog { display: block; width: 100%; text-align: left; font-size: 12px; padding: 8px; margin-bottom: 5px; min-height: 0; background: rgba(255,255,255,.06); color: var(--txt); border-radius: 8px; }
  .sub-jog.sel { background: var(--gold); color: #1f1600; }
  .campo-rotulo { font-size: 11px; color: var(--grey); letter-spacing: 1px; text-transform: uppercase; margin: 6px 0; }
  .patro-topo { display: flex; align-items: center; gap: 12px; }
  .patro-topo strong { font-size: 16px; }
  .logo-q { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .dia.res-v { border-left: 3px solid var(--green); }
  .dia.res-e { border-left: 3px solid var(--gold); }
  .dia.res-d { border-left: 3px solid var(--red); }
  .dia.futuro { opacity: .85; }
  .sub-cols > div { max-height: 210px; overflow-y: auto; padding-right: 4px; }
  .sub-jog { font-size: 12px !important; padding: 7px 8px !important; }
  .sub-painel { max-height: 300px; overflow-y: auto; }
  .seg { overflow-x: auto; scrollbar-width: none; }
  .seg button { flex: 0 0 auto; min-width: 84px; }
  nav.inferior button { flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  nav.inferior button.avancar { flex: 0 0 84px; }
  nav.inferior button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-size: 9px !important; letter-spacing: .3px; }
  nav.inferior button .num { font-size: 9px !important; }
  nav.inferior button.avancar span:last-child { font-size: 10px !important; }
  .entrevista { display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(139,92,246,.10); border: 1px solid rgba(139,92,246,.25); margin-bottom: 10px; }
  .entrevista-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #7c3aed); display: grid; place-items: center; font-weight: 900; color: #fff; flex: 0 0 40px; }
  .entrevista-corpo { min-width: 0; flex: 1; }
  .entrevista-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .entrevista-topo b { font-size: 14px; }
  .entrevista-topo span { font-size: 10px; font-weight: 800; color: #c4b5fd; letter-spacing: .6px; }
  .entrevista-topo small { color: var(--grey); font-size: 11px; margin-left: auto; }
  .entrevista p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; font-style: italic; }
  .serie-b-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .serie-b-card .escudo-img, .serie-b-card .escudo { width: 48px; height: 48px; flex-basis: 48px; }
  .serie-b-card b { display: block; font-size: 15px; }
  .serie-b-card small { color: var(--grey); font-size: 12px; }
</style>

// Mercado: jogadores reais dos elencos dos outros clubes escolhidos
function sorteiaLivres() {
  const idsLivres = new Set(estado.livres ? estado.livres.map(j => j.id) : []);
  const outros = estado.times
    .filter(t => t !== estado.meu && !t.folga)
    .flatMap(t => t.elenco.map(j => ({ ...j, origem: t.nome })))
    .filter(j => !idsLivres.has(j.id));
  const embaralha = arr => arr.sort(() => Math.random() - 0.5);
  const base = embaralha(outros.filter(j => j.idade && j.idade <= 21)).slice(0, 6);
  const resto = embaralha(outros.filter(j => !(j.idade && j.idade <= 21))).slice(0, 10);
  return [...base, ...resto];
}

      if (a) { j.nome = a.nome; if (a.idade) j.idade = a.idade; j.pot = (j.idade || 24) <= 23 ? Math.max(j.ovr, j.pot || j.ovr) : j.ovr; }

  });
}

  elenco.forEach(j => { const i = (IDADES_BASE[clube.nome] || {})[j.nome]; if (i) j.idade = i; });

function gerarRodadas(n) {
  let ids = [...Array(n).keys()];
  const ida = [];
  for (let r = 0; r < n - 1; r++) {
    const pares = [];
    for (let i = 0; i < n / 2; i++) pares.push([ids[i], ids[n - 1 - i]]);
    ida.push(pares);
    ids = [ids[0], ids[n - 1], ...ids.slice(1, n - 1)];
  }
  return [...ida, ...ida.map(r => r.map(([a, b]) => [b, a]))];
}

// Calendário de 38 rodadas: repete o turno e o returno, alternando mando de campo
function calendario38(n) {
  const base = gerarRodadas(n);
  const inv = base.map(r => r.map(([a, b]) => [b, a]));
  return [...base, ...inv, ...base, ...inv].slice(0, 38);
}

// Rodadas da fase de grupos (método do círculo com "folga" quando o número é ímpar)
function rodadasNomes(nomes, dobro) {
  const ids = nomes.length % 2 ? [...nomes, null] : [...nomes];
  const n = ids.length;
  let rot = [...ids];
  const ida = [];
  for (let r = 0; r < n - 1; r++) {
    const pares = [];
    for (let i = 0; i < n / 2; i++) { const a = rot[i], b = rot[n - 1 - i]; if (a && b) pares.push([a, b]); }
    ida.push(pares);
    rot = [rot[0], rot[n - 1], ...rot.slice(1, n - 1)];
  }
  return dobro ? [...ida, ...ida.map(r => r.map(([a, b]) => [b, a]))] : ida;
}

// Sorteia a ordem dos confrontos de cada competição (cada carreira tem um sorteio próprio)
function gerarPlanoComps() {
  estado.planoComps = {};
  COMPETICOES.forEach(d => { estado.planoComps[d.id] = rodadasNomes([...d.clubes].sort(() => Math.random() - 0.5), d.dobro); });
}

function iniciarComp(i) {
  const def = COMPETICOES[i];
  if (!def) { estado.comp = null; estado.compIdx = COMPETICOES.length; return; }
  const stats = {};
  def.clubes.forEach(n => { stats[n] = { pts: 0, gf: 0, ga: 0, jg: 0 }; });
  estado.compIdx = i;
  const plano = estado.planoComps && estado.planoComps[def.id];
  estado.comp = { def, rodadas: plano ? JSON.parse(JSON.stringify(plano)) : rodadasNomes([...def.clubes].sort(() => Math.random() - 0.5), def.dobro), idx: 0, hist: [], stats, fase: "grupo", faseNome: "fase de grupos", vencedores: [], campeao: null };
}

function classificacaoComp(c) {
  return Object.entries(c.stats).sort((x, y) => (y[1].pts - x[1].pts) || ((y[1].gf - y[1].ga) - (x[1].gf - x[1].ga)) || (y[1].gf - x[1].gf));
}

function compPorId(id) {
  if (estado.comp && estado.comp.def.id === id) return estado.comp;
  return estado.concluidas.find(c => c.def.id === id) || null;
}

function finalizarComp(campeao) {
  const c = estado.comp;
  c.campeao = campeao;
  c.faseNome = "campeão";
  TITULOS[campeao][c.def.chave] += 1;
  if (c.def.id === "playoff") {

    if (campeao === estado.meu.nome) estado.celebrar = { campeao, ano: 2026 };
  }

  estado.concluidas.push(c);
  mostrarToast(`${campeao} é campeão ${c.def.abrev}!`);
  iniciarComp(estado.compIdx + 1);
}

function avancarComp() {
  pagarEmprestimos();
  const c = estado.comp;
  const rod = c.rodadas[c.idx];
  c.vencedores = [];
  for (const [a, b] of rod) {
    const ta = estado.times.find(t => t.nome === a), tb = estado.times.find(t => t.nome === b);
    let [gc, gf] = simular(ta, tb);
    if (c.fase !== "grupo" && gc === gf) { if (Math.random() < 0.5) gc++; else gf++; }
    c.hist.push({ fase: c.fase, rodada: c.idx + 1, casa: a, fora: b, gc, gf });
    postarResultado(ta, tb, gc, gf);
    if (c.fase === "grupo") {
      for (const [n, gp, gs] of [[a, gc, gf], [b, gf, gc]]) {
        const st = c.stats[n]; st.jg++; st.gf += gp; st.ga += gs;
        if (gp > gs) st.pts += 3; else if (gp === gs) st.pts += 1;
      }
    } else {
      c.vencedores.push(gc > gf ? a : b);
    }
  }
  c.idx++;
  if (c.fase === "grupo" && c.idx >= c.rodadas.length) {
    const top = classificacaoComp(c).slice(0, c.def.classif).map(([n]) => n);
    if (c.def.classif === 2) {
      c.rodadas.push([[top[0], top[1]]]); c.fase = "final"; c.faseNome = "final";
    } else {
      c.rodadas.push([[top[0], top[3]], [top[1], top[2]]]); c.fase = "semi"; c.faseNome = "semifinal";
    }
    mostrarToast(`${c.def.abrev}: fase de grupos encerrada.`);
  } else if (c.fase === "semi") {
    c.rodadas.push([[c.vencedores[0], c.vencedores[1]]]); c.fase = "final"; c.faseNome = "final";
    mostrarToast(`${c.def.abrev}: final marcada.`);
  } else if (c.fase === "final") {
    finalizarComp(c.vencedores[0]);
    return render();
  } else {
    mostrarToast(`${c.def.abrev}: rodada ${c.idx} jogada.`);
  }
  render();
}

// Overall dinâmico: jovens com potencial sobem a cada temporada; jogadores velhos perdem nota e valor
function envelhecerJogador(j) {
  j.idade = (j.idade || 24) + 1;
  if (j.idade <= 23 && j.pot && j.ovr < j.pot) {
    j.ovr = Math.min(j.pot, j.ovr + 1 + Math.floor(Math.random() * 4));
  } else if (j.idade >= 31) {
    const perda = j.idade >= 35 ? 3 + Math.floor(Math.random() * 4) : j.idade >= 33 ? 2 + Math.floor(Math.random() * 3) : Math.floor(Math.random() * 3);
    j.ovr = Math.max(40, j.ovr - perda);
  }
  j.salario = Math.max(0.5, Math.round((j.ovr - 45) * 1.5 * 10) / 10);
  j.pedido = Math.round(j.salario * (0.9 + Math.random() * 0.3) * 10) / 10;
}
function envelhecerElenco() {
  estado.times.forEach(t => { if (!t.folga) t.elenco.forEach(envelhecerJogador); });
  (estado.base || []).forEach(envelhecerJogador);
}

// Calendário aleatório: a ordem dos times, o mando e a ordem das rodadas mudam a cada jogo novo,
// então a folga pode cair em qualquer rodada.
function novoCalendario() {
  const n = estado.times.length;
  const perm = [...Array(n).keys()];
  for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const base = gerarRodadas(n).map(r => r.map(([a, b]) => [perm[a], perm[b]]))
    .map(r => r.map(([a, b]) => (Math.random() < 0.5 ? [a, b] : [b, a])));
  const invertido = base.map(r => r.map(([a, b]) => [b, a]));
  const rodadas = [...base, ...invertido, ...base, ...invertido].slice(0, 38);
  for (let i = rodadas.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rodadas[i], rodadas[j]] = [rodadas[j], rodadas[i]]; }
  return rodadas;
}

// Dinheiro: valores internos em mil; exibidos em milhão quando passam de 1.000 mil
function fmtMil(v) {
  const n = Number(v) || 0;
  if (Math.abs(n) >= 1000) return "R$ " + (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " milhão";
  return "R$ " + n.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
}
// Overall do jogador na posição escolhida: fora da posição, perde pontos
function ovrNoSlot(j, pos) {
  if (j.pos === pos) return j.ovr;
  if (pos === "GOL" || j.pos === "GOL") return Math.max(0, j.ovr - 40);
  if ((COMPAT[pos] || []).includes(j.pos)) return j.ovr - 5;
  return j.ovr - 15;
}

// Dificuldade da carreira: Fácil ajuda o time em campo e aguenta mais derrotas
function bonusDificuldade() { return { facil: 4, medio: 2, normal: 0 }[estado.dificuldade] || 0; }
function limiteDerrotas() { return { facil: 6, medio: 4, normal: 3 }[estado.dificuldade] || 4; }

function forca(t) {
  let top = t.elenco.map(j => j.ovr).sort((a, b) => b - a).slice(0, 11);
  if (t.escal && t.escal.ids.every(id => id == null || t.elenco.some(j => j.id === id))) {
    const slots = FORMACOES[t.escal.formacao];
    const titulares = t.escal.ids
      .map((id, i) => (id == null ? null : ovrNoSlot(t.elenco.find(j => j.id === id), slots[i].pos)))
      .filter(v => v != null);
    if (titulares.length >= 7) top = titulares;
  }
  const base = top.length ? top.reduce((s, v) => s + v, 0) / top.length : 40;
  return base + (t === estado.meu ? estado.treinoBonus + bonusDificuldade() : 0);
}

function simular(casa, fora) {
  const diff = forca(casa) - forca(fora);
  const pc = Math.min(0.5, Math.max(0.02, 0.12 + diff / 200));
  const pf = Math.min(0.5, Math.max(0.02, 0.12 - diff / 200));
  let gc = 0, gf = 0;
  for (let i = 0; i < 6; i++) { if (Math.random() < pc) gc++; if (Math.random() < pf) gf++; }
  return [gc, gf];
}

// Layout automático: deitado quando o celular está na horizontal, em pé quando está na vertical
const MQ_DEITADO = typeof window !== "undefined" && window.matchMedia ? window.matchMedia("(orientation: landscape) and (max-height: 600px)") : null;
function aplicarLayout() {
  document.body.classList.toggle("ls", !!(MQ_DEITADO && MQ_DEITADO.matches));
}
if (MQ_DEITADO && MQ_DEITADO.addEventListener) MQ_DEITADO.addEventListener("change", aplicarLayout);

function ir(tela) {
  if (estado.tela === "aovivo" && tela !== "aovivo") { mostrarToast("Termine a partida antes de sair."); return; }
  estado.tela = tela;
  estado.escalSel = null;
  fecharModal(true);
  render();
}

function mostrarToast(texto) {
  const el = $("toast");
  el.textContent = texto;
  el.classList.add("on");
  clearTimeout(mostrarToast.t);
  mostrarToast.t = setTimeout(() => el.classList.remove("on"), 2600);
}

function escolherTime(i) {
  estado.meu = estado.times[i];
  estado.escolhido = true;
  estado.escalIdx = i;
  if (estado.rodada === 0 && estado.historico.length === 0) estado.rodadas = novoCalendario();
  if (estado.rodada === 0 && estado.historico.length === 0 && !estado.patroAtivo) {
    estado.patrocinios = [];
    estado.patroAtivo = null;
    gerarPatrocinios();
    estado.tela = "patrocinio_inicio";
  } else {
    estado.tela = "jogos";
  }
  mostrarToast(`Você agora controla o ${estado.meu.nome}.`);
  render();
}

function preJogo() {
  if (estado.tela === "aovivo") { mostrarToast("Partida em andamento."); return; }
  const idx = estado.times.indexOf(estado.meu);
  if (estado.comp) return preJogoComp();
  const jogo = (estado.rodadas[estado.rodada] || []).find(([c, f]) => c === idx || f === idx);
  if (!jogo) return avancar();
  const [c, f] = jogo;
  const a = estado.times[c], b = estado.times[f];
  if (a.folga || b.folga) {
    $("folha").innerHTML = `
      <div class="pre-titulo">Rodada ${estado.rodada + 1} · Treino</div>
      <p style="text-align:center;font-size:15px;margin:14px 0">Dia de treino. Escolha o foco para o próximo jogo:</p>
      <div class="botoes">
        <button class="primario" onclick="treinar('ataque')">Ataque · +3</button>
        <button class="primario" onclick="treinar('defesa')">Defesa · +3</button>
        <button class="primario" onclick="treinar('fisico')">Físico · +2</button>
        <button class="fechar" onclick="treinar(null)">Pular treino</button>
      </div>`;
    $("fundo").classList.add("aberto");
    return;
  }
  $("folha").innerHTML = `
    <div class="pre-titulo">Rodada ${estado.rodada + 1} · ${a === estado.meu ? "você joga em casa" : "você joga fora"}</div>
    <div class="versus">
      <div class="lado">${escudo(a)}</div>
      <div class="x">x</div>
      <div class="lado">${escudo(b)}</div>
    </div>
    <div class="botoes">
      <button class="primario" onclick="confirmarRodada()">Jogar ▶</button>
      <button class="fechar" onclick="fecharModal()">Voltar</button>
    </div>`;
  $("fundo").classList.add("aberto");
}

function treinar(tipo) {
  const valores = { ataque: 3, defesa: 3, fisico: 2 };

}

}

// Partida ao vivo em campo: jogadores nas posições, bola se movendo, gols, faltas e cartões
const ICONE_CARTAO = {
  amarelo: '<svg viewBox="0 0 10 14" class="cartao-ic"><rect width="10" height="14" rx="1.5" fill="#facc15"/></svg>',
  vermelho: '<svg viewBox="0 0 10 14" class="cartao-ic"><rect width="10" height="14" rx="1.5" fill="#ef4444"/></svg>'
};
function rotuloMin(m, p1, p2) {
  if (m <= 45) return m + "'";
  if (m <= p1) return "45+" + (m - 45) + "'";
  if (m <= 90) return (m - (p1 - 45)) + "'";
  return "90+" + (m - 90) + "'";
}
function mostrarAoVivo() {
  const up = estado.ultimaPartida;
  if (!up) return;
  estado.aoVivoPausado = false;
  const [meus, deles] = up.placar.split(" x ").map(Number);
  const adv = estado.times.find(t => t.nome === up.adversario) || estado.times[0];
  const sorteia = (n) => Math.floor(Math.random() * n);
  const minutos = (n) => Array.from({ length: n }, () => 1 + sorteia(88)).sort((a, b) => a - b);
  const acr1 = 1 + sorteia(3), acr2 = 2 + sorteia(4);
  const P1 = 45 + acr1, FIM = 90 + acr2, PAUSA2 = 70;

  const eventos = [];
  minutos(meus).forEach(m => eventos.push({ m, tipo: "gol", lado: "eu" }));
  minutos(deles).forEach(m => eventos.push({ m, tipo: "gol", lado: "adv" }));
  ["eu", "adv"].forEach(lado => {
    minutos(2 + sorteia(3)).forEach(m => eventos.push({ m, tipo: "falta", lado }));
    if (Math.random() < 0.35) eventos.push({ m: 1 + sorteia(88), tipo: "amarelo", lado });
    if (Math.random() < 0.04) eventos.push({ m: 30 + sorteia(55), tipo: "vermelho", lado });
    [55 + sorteia(20), 60 + sorteia(20)].forEach(m => eventos.push({ m, tipo: "subst", lado }));
  });
  eventos.push({ m: P1, tipo: "intervalo", lado: "neutro" });
  eventos.push({ m: PAUSA2, tipo: "pausa", lado: "neutro" });
  eventos.sort((a, b) => a.m - b.m);

  const formEu = estado.formacao;
  const eBase = getEscal(estado.meu, formEu);
  const titEu = FORMACOES[formEu].map((slot, k) => {
    const jg = estado.meu.elenco.find(x => x.id === eBase.ids[k]) || [...estado.meu.elenco].sort((a, b) => b.ovr - a.ovr)[k];
    return { jog: jg, x: slot.x, y: slot.y };
  });
  const bancoEu = estado.meu.elenco.filter(x => !titEu.some(t => t.jog && t.jog.id === x.id)).sort((a, b) => b.ovr - a.ovr);
  const titAdvJ = [...adv.elenco].sort((a, b) => b.ovr - a.ovr);
  const titAdv = titAdvJ.slice(0, 11).map((jg, k) => { const slot = FORMACOES["442"][k]; return { jog: jg, x: slot.x, y: 100 - slot.y }; });
  const bancoAdv = titAdvJ.slice(11);
  const dots = [];
  titEu.forEach((t, k) => dots.push({ id: "eu" + k, lado: "eu", x: t.x, y: t.y, cor: estado.meu.cor, texto: estado.meu.texto, num: k + 1, jogId: t.jog ? t.jog.id : null, nome: t.jog ? t.jog.nome : "", pos: t.jog ? t.jog.pos : "MEI", ovr: t.jog ? t.jog.ovr : 60, amarelos: 0, expulso: false }));
  titAdv.forEach((t, k) => dots.push({ id: "adv" + k, lado: "adv", x: t.x, y: t.y, cor: adv.cor, texto: adv.texto, num: k + 1, jogId: t.jog ? t.jog.id : null, nome: t.jog ? t.jog.nome : "", pos: t.jog ? t.jog.pos : "MEI", ovr: t.jog ? t.jog.ovr : 60, amarelos: 0, expulso: false }));
  const pega = (lado, pred) => { const l = dots.filter(d => d.lado === lado && !d.expulso); return (pred && l.filter(pred)[0]) || l[sorteia(l.length)]; };
  const benchEu = [...bancoEu], benchAdv = [...bancoAdv];
  estado.aoVivoCtx = { dots, benchEu, subSel: null, subBanco: null, titulo: "", minAtual: 0, P1, PAUSA2 };

  estado.aoVivoHtml = `
    <div class="secao"><h2>Ao vivo</h2><span>${estado.comp ? estado.comp.def.nome : "Brasileiro"}</span></div>
    <div class="ao-vivo-topo"><span class="ao-vivo-tag">AO VIVO</span><span id="av-min">0'</span></div>
    <div class="ao-vivo-placar">
      <div class="ao-vivo-time">${escudo(estado.meu)}<small>${estado.meu.nome}</small></div>
      <div class="ao-vivo-numeros"><b id="av-eu">0</b><span>x</span><b id="av-adv">0</b></div>
      <div class="ao-vivo-time">${escudo(adv)}<small>${adv.nome}</small></div>
    </div>
    <div class="ao-campo" id="av-campo">
      <div class="ao-meio"></div><div class="ao-circ"></div>
      <div class="ao-gol topo"></div><div class="ao-gol base"></div>
      ${dots.map(d => `<div class="ao-jog" id="d-${d.id}" style="left:${d.x}%;top:${d.y}%;background:${d.cor};color:${d.texto}">${d.num}</div>`).join("")}
      <div class="ao-bola" id="av-bola" style="left:50%;top:50%"></div>
    </div>
    <div id="av-painel"></div>
    <div class="ao-vivo-stats">
      <div><span>Posse</span><b>${up.posse}% · ${100 - up.posse}%</b></div>
      <div><span>Chutes</span><b>${up.chutesSeu} · ${up.chutesAdv}</b></div>
    </div>
    <div class="ao-vivo-eventos" id="av-eventos"></div>`;
  estado.tela = "aovivo";
  render();

  let minuto = 0, placarEu = 0, placarAdv = 0, k = 0;
  const moveBola = (x, y) => { const b = $("av-bola"); if (b) { b.style.left = x + "%"; b.style.top = y + "%"; } };
  const passo = () => {
    minuto++;
    const minEl = $("av-min"); if (minEl) minEl.textContent = rotuloMin(minuto, P1, FIM);
    dots.forEach(d => {
      if (d.expulso) return;
      const node = $("d-" + d.id);
      if (node) { node.style.left = Math.max(4, Math.min(96, d.x + (Math.random() * 3 - 1.5))) + "%"; node.style.top = Math.max(4, Math.min(96, d.y + (Math.random() * 3 - 1.5))) + "%"; }
    });
    const feed = $("av-eventos");
    while (k < eventos.length && eventos[k].m <= minuto) {
      const ev = eventos[k++];
      let icone = "", texto = "", classe = "";
      const linha = (conteudoIcone, txt, cl) => { if (feed) feed.insertAdjacentHTML("afterbegin", `<div class="ao-vivo-ev ${cl}"><b>${rotuloMin(ev.m, P1, FIM)}</b>${conteudoIcone}<span>${txt}</span></div>`); };
      if (ev.tipo === "intervalo") { linha("", "Intervalo", "neutro"); continue; }
      if (ev.tipo === "pausa") { linha("", "Janela de substituição", "neutro"); continue; }
      if (ev.tipo === "gol") {
        const atacante = pega(ev.lado, d => ["ATA", "PON", "MEI"].includes(d.pos));
        if (ev.lado === "eu") { placarEu++; moveBola(50, 3); } else { placarAdv++; moveBola(50, 97); }
        estado.golPendente = atacante ? atacante.nome : (ev.lado === "eu" ? estado.meu.nome : adv.nome);
        mostrarGol();
        const a = $("av-eu"), b = $("av-adv"); if (a) a.textContent = placarEu; if (b) b.textContent = placarAdv;
        setTimeout(() => moveBola(50, 50), 1100);
        icone = '<svg viewBox="0 0 20 20" class="cartao-ic"><circle cx="10" cy="10" r="8.5" fill="#fff" stroke="#111"/><polygon points="10,5 14,8 12.5,13 7.5,13 6,8" fill="#111"/></svg>';
        linha(icone, `Gol · ${atacante ? atacante.nome : ""}`, "gol " + ev.lado); continue;
      }
      if (ev.tipo === "falta") {
        const vitima = pega(ev.lado === "eu" ? "adv" : "eu");
        if (vitima) moveBola(vitima.x, vitima.y);
        linha('<span class="falta-tag">FALTA</span>', `Falta sofrida por ${vitima ? vitima.nome : ""}`, ev.lado); continue;
      }
      if (ev.tipo === "amarelo") {
        const jg = pega(ev.lado); jg.amarelos++;
        const nd = $("d-" + jg.id); if (nd) nd.classList.add("amar");
        linha(ICONE_CARTAO.amarelo, `Cartão amarelo · ${jg.nome}`, ev.lado); continue;
      }
      if (ev.tipo === "vermelho") {
        const jg = pega(ev.lado); jg.expulso = true;
        const nd = $("d-" + jg.id); if (nd) nd.classList.add("exp");
        linha(ICONE_CARTAO.vermelho, `Cartão vermelho · ${jg.nome} expulso`, ev.lado); continue;
      }
      if (ev.tipo === "subst" && ev.lado === "adv") {
        const jg = pega("adv"); const entra = benchAdv.shift();
        if (jg && entra) { const saiu = jg.nome; jg.nome = entra.nome; jg.pos = entra.pos; jg.ovr = entra.ovr; linha('<span class="sub-tag">SUB</span>', `Entra ${entra.nome}, sai ${saiu}`, "adv"); }
        continue;
      }
    }
    if (minuto === P1 || minuto === PAUSA2) {
      clearInterval(estado.aoVivoTimer);
      estado.aoVivoPausado = true;
      abrirPainelSubs(minuto === P1 ? "Intervalo · 2º tempo" : "Substituições");
      return;
    }
    if (minuto >= FIM) {
      clearInterval(estado.aoVivoTimer);
      const fm = $("av-min"); if (fm) fm.textContent = "Fim de jogo";
      setTimeout(() => { if (estado.tela === "aovivo") fimAoVivo(); }, 2500);
    }
  };
  estado.aoVivoPasso = passo;
  clearInterval(estado.aoVivoTimer);
  estado.aoVivoTimer = setInterval(passo, 160 / (estado.velocidade || 1));
}

// Substituições do seu time (pausa no intervalo e aos 70')
function abrirPainelSubs(titulo) {
  const ctx = estado.aoVivoCtx;
  const painel = $("av-painel");
  if (!ctx || !painel) return;
  ctx.titulo = titulo;
  const emCampo = ctx.dots.filter(d => d.lado === "eu" && !d.expulso);
  painel.innerHTML = `
    <div class="sub-painel">
      <h4>${titulo}</h4>
      <div class="sub-cols">
        <div><small>Em campo</small>${emCampo.map(d => `<button class="sub-jog ${ctx.subSel === d.id ? "sel" : ""}" onclick="subTit('${d.id}')">${d.num} · ${d.nome}</button>`).join("")}</div>
        <div><small>Banco</small>${ctx.benchEu.map(j => `<button class="sub-jog ${ctx.subBanco === j.id ? "sel" : ""}" onclick="subBanco(${j.id})">${j.nome} · ${j.ovr}</button>`).join("")}</div>
      </div>
      <button class="primario" onclick="retomarAoVivo()">Continuar</button>
    </div>`;
}
function subTit(id) { const ctx = estado.aoVivoCtx; ctx.subSel = ctx.subSel === id ? null : id; if (ctx.subSel && ctx.subBanco) executaSub(); else abrirPainelSubs(ctx.titulo); }
function subBanco(jid) { const ctx = estado.aoVivoCtx; ctx.subBanco = ctx.subBanco === jid ? null : jid; if (ctx.subSel && ctx.subBanco) executaSub(); else abrirPainelSubs(ctx.titulo); }
function executaSub() {
  const ctx = estado.aoVivoCtx;
  const d = ctx.dots.find(x => x.id === ctx.subSel);
  const idx = ctx.benchEu.findIndex(j => j.id === ctx.subBanco);
  if (!d || idx < 0) { ctx.subSel = null; ctx.subBanco = null; abrirPainelSubs(ctx.titulo); return; }
  const entra = ctx.benchEu.splice(idx, 1)[0];
  ctx.benchEu.push({ id: d.jogId, nome: d.nome, ovr: d.ovr, pos: d.pos });
  const saiu = d.nome;
  d.jogId = entra.id; d.nome = entra.nome; d.pos = entra.pos; d.ovr = entra.ovr;
  const feed = $("av-eventos");
  if (feed) feed.insertAdjacentHTML("afterbegin", `<div class="ao-vivo-ev eu"><b>${$("av-min") ? $("av-min").textContent : ""}</b><span class="sub-tag">SUB</span><span>Entra ${entra.nome}, sai ${saiu}</span></div>`);
  ctx.subSel = null; ctx.subBanco = null;
  abrirPainelSubs(ctx.titulo);
}
function retomarAoVivo() {
  estado.aoVivoPausado = false;
  const painel = $("av-painel"); if (painel) painel.innerHTML = "";
  clearInterval(estado.aoVivoTimer);
  if (estado.aoVivoPasso) estado.aoVivoTimer = setInterval(estado.aoVivoPasso, 160 / (estado.velocidade || 1));
}
function fimAoVivo() {
  clearInterval(estado.aoVivoTimer);
  if (estado.aoVivoPasso) {
    let guarda = 0;
    while (guarda++ < 200 && $("av-min") && $("av-min").textContent !== "Fim de jogo") estado.aoVivoPasso();
  }
  estado.tela = "jogos";
  render();
}

let ID_POST = 0;
function postar(texto, tipo) {
  const pool = COMENTARIOS_TORCIDA[tipo] || COMENTARIOS_TORCIDA.liga;
  const comentarios = [pool[Math.floor(Math.random() * pool.length)], pool[Math.floor(Math.random() * pool.length)]]
    .map((t, i) => ({ autor: "Torcedor " + (i + 1 + Math.floor(Math.random() * 90)), texto: t }));
  estado.feed.unshift({ id: ++ID_POST, texto, tipo, rod: estado.rodada, curtidas: 0, curtiu: false, comentarios });
  if (estado.feed.length > 40) estado.feed.pop();
}

function curtirPost(id) {
  const p = estado.feed.find(x => x.id === id);
  if (!p) return;
  p.curtiu = !p.curtiu;
  p.curtidas += p.curtiu ? 1 : -1;
  render();
}

function comentarPost(id) {
  const campo = $("c" + id);
  const texto = campo && campo.value ? String(campo.value).trim() : "";
  if (!texto) return;
  const p = estado.feed.find(x => x.id === id);
  if (!p) return;
  p.comentarios.push({ autor: "Você", texto: texto.slice(0, 120) });
  render();
}

// Comentários dos jogadores após cada partida do seu time
function gerarComentJog(meus, deles) {
  const pool = [...estado.meu.elenco].sort((x, y) => y.ovr - x.ovr).slice(0, 11);
  if (!pool.length) return;
  const j = pool[Math.floor(Math.random() * pool.length)];
  const frases = meus > deles
    ? ["Hoje o grupo jogou junto, que vitória!", "Isso é só o começo, bora pro próximo jogo.", "Fiz a minha parte, o resto foi o time."]
    : meus === deles
      ? ["Empate dói, mas seguimos firmes.", "Faltou um pouco de sorte hoje."]
      : ["Precisamos treinar mais forte e reagir.", "Assumo a minha parte, vamos corrigir."];
  estado.comentJog.unshift({ id: ++ID_POST, rod: estado.rodada, autor: j.nome, pos: j.pos, texto: frases[Math.floor(Math.random() * frases.length)] });
  if (estado.comentJog.length > 40) estado.comentJog.pop();
}
function renderComentJog() {
  if (!estado.comentJog.length) return '<p class="resumo" style="text-align:center">Nenhuma entrevista de jogador ainda.</p>';
  return `<div class="jog-entrevistas">${estado.comentJog.map(c => `
    <div class="entrevista">
      <div class="entrevista-avatar">${c.autor.charAt(0)}</div>
      <div class="entrevista-corpo">
        <div class="entrevista-topo"><b>${c.autor}</b><span>${c.pos}</span><small>${c.rod ? "R" + c.rod : ""}</small></div>
        <p>“${c.texto}”</p>
      </div>
    </div>`).join("")}</div>`;
}

function postarResultado(a, b, gc, gf) {
  const eu = estado.meu;
  if (a !== eu && b !== eu) { postar(`${a.nome} ${gc} x ${gf} ${b.nome}`, "liga"); return; }
  const euCasa = a === eu;
  const meus = euCasa ? gc : gf, deles = euCasa ? gf : gc;
  const opp = euCasa ? b.nome : a.nome;
  estado.sequencia = meus > deles ? estado.sequencia + 1 : 0;
  gerarComentJog(meus, deles);
  estado.agenda.push({ semana: estado.semana || 0, casa: a.nome, fora: b.nome, gc, gf, comp: estado.comp ? estado.comp.def.abrev : "Brasileiro" });
  processarPatrocinio(meus > deles);
  estado.derrotasSeguidas = meus < deles ? (estado.derrotasSeguidas || 0) + 1 : 0;
  if (estado.derrotasSeguidas >= limiteDerrotas()) estado.reuniao = true;
  const posse = Math.max(30, Math.min(70, Math.round(50 + (meus - deles) * 4 + (Math.random() * 12 - 6))));
  const chutesSeu = meus * 3 + 3 + Math.floor(Math.random() * 6);
  const chutesAdv = deles * 3 + 3 + Math.floor(Math.random() * 6);
  const destaque = [...estado.meu.elenco].sort((x, y) => y.ovr - x.ovr)[0];
  const artilheiro = [...estado.meu.elenco].filter(j => ["ATA", "PON", "MEI"].includes(j.pos)).sort((x, y) => y.ovr - x.ovr)[0];

  if (artilheiro && meus > 0) { const antes = estado.estat[artilheiro.id] || { gols: 0, assist: 0 }; estado.estat[artilheiro.id] = { gols: antes.gols + meus, assist: antes.assist }; }
  estado.pressPendente = true;
  estado.ultimaPartida = { adversario: opp, placar: `${meus} x ${deles}`, posse, chutesSeu, chutesAdv, destaque: destaque ? destaque.nome : "—" };
  if (meus > deles) {
    estado.torcida = Math.min(100, estado.torcida + 4);
    postar(`Vitória sobre o ${opp} por ${meus} x ${deles}! A torcida comemora.`, "vitoria");
  } else if (meus === deles) {
    estado.torcida = Math.min(100, Math.max(0, estado.torcida + 1));
    postar(`Empate com o ${opp}, ${meus} x ${deles}. Fica o gosto de quero mais.`, "empate");
  } else {
    estado.torcida = Math.max(0, estado.torcida - 3);
    postar(`Derrota para o ${opp}, ${deles} x ${meus}. A torcida cobra reação.`, "derrota");
  }
}

function avancar() {
  if (estado.tela === "aovivo") { mostrarToast("Partida em andamento."); return; }
  estado.semana = (estado.semana || 0) + 1;
  estado.calMes = 0;
  if (estado.comp) return avancarComp();
  pagarEmprestimos();
  if (estado.rodada >= estado.rodadas.length) { mostrarToast("Temporada encerrada!"); return; }
  let resumo = "";
  for (const [c, f] of estado.rodadas[estado.rodada]) {
    const a = estado.times[c], b = estado.times[f];
    if (a.folga || b.folga) continue;
    const [gc, gf] = simular(a, b);
    estado.historico.push({ rodada: estado.rodada + 1, casa: a.nome, fora: b.nome, gc, gf });
    for (const [t, gp, gs] of [[a, gc, gf], [b, gf, gc]]) {
      t.jg++; t.gf += gp; t.ga += gs;
      if (gp > gs) t.pts += 3; else if (gp === gs) t.pts += 1;
    }
    if (a === estado.meu || b === estado.meu) { resumo = `${a.nome} ${gc} x ${gf} ${b.nome}`; postarResultado(a, b, gc, gf); } else postar(`${a.nome} ${gc} x ${gf} ${b.nome}`, "liga");
    if (a === estado.meu || b === estado.meu) estado.treinoBonus = 0;
  }
  for (const t of estado.times) {
    if (t.folga) continue;
    const folha = t.elenco.reduce((s, j) => s + j.salario, 0);
    t.orcamento = Math.round((t.orcamento - folha / 4) * 10) / 10;
  }
  estado.rodada++;
  if (estado.rodada === estado.rodadas.length) iniciarPlayoff();
  if (estado.rodada % 4 === 0) evoluirBase();
  if (estado.rodada % 4 === 0) transferenciasIA();
  if (estado.rodada % 24 === 0) captarJovens();
  gerarPropostas();
  if (estado.rodada % 12 === 0) gerarPatrocinios();
  let msg = resumo || "Rodada simulada.";
  if (estado.rodada % 5 === 0) {
    estado.livres = sorteiaLivres();
    msg += " Mercado renovado.";
  }
  mostrarToast(msg);
  render();
}

function contratar(mult) {
  if (estado.sel === null) return;
  const j = estado.livres[estado.sel];
  const oferta = Math.max(1, Math.round(j.salario * mult * 10) / 10);
  if (oferta < j.pedido) { mostrarToast(`${j.nome} recusou a oferta de ${fmtMil(oferta)}/rodada.`); return; }
  const bonus = Math.round(oferta * 2 * 10) / 10;
  if (estado.meu.orcamento < bonus) { mostrarToast("Orçamento insuficiente para o bônus de assinatura."); return; }
  if (estado.meu.elenco.length >= 60) { mostrarToast("Elenco cheio (máx. 60)."); return; }
  if (j.origem) {
    const o = estado.times.find(t => t.nome === j.origem);
    if (o && o.elenco.length <= 11) { mostrarToast(`${o.nome} não pode perder mais jogadores agora.`); return; }
  }
  estado.meu.orcamento = Math.round((estado.meu.orcamento - bonus) * 10) / 10;
  j.salario = oferta;
  if (j.origem) {
    const origem = estado.times.find(t => t.nome === j.origem);
    if (origem) origem.elenco = origem.elenco.filter(x => x.id !== j.id);
    delete j.origem;
  }
  estado.meu.elenco.push(j);
  estado.meu.escal = null;
  estado.livres.splice(estado.sel, 1);
  fecharModal(true);
  mostrarToast(`${j.nome} assinou por ${fmtMil(oferta)}/rodada!`);
  render();
}

function dispensar() {
  if (estado.sel === null) return;
  if (estado.meu.elenco.length <= 11) { mostrarToast("Você precisa de pelo menos 11 jogadores."); return; }
  const [j] = estado.meu.elenco.splice(estado.sel, 1);
  estado.meu.escal = null;
  estado.livres.push(j);
  fecharModal(true);
  mostrarToast(`${j.nome} foi dispensado.`);
  render();
}

function abrirJogador(i) { estado.sel = i; estado.neg = { valor: "", duracao: 12, luvas: 2, unidade: "mil" }; renderModal(); $("fundo").classList.add("aberto"); }
function fecharModal(silencioso) {
  estado.sel = null;
  $("fundo").classList.remove("aberto");
  if (!silencioso) render();
}
function fecharSeFundo(e) { if (e.target.id === "fundo") fecharModal(); }

// Negociação de contrato: salário digitado, duração e luvas
function precoContrato(j, meses) {
  const fator = meses <= 6 ? 1.05 : meses >= 24 ? 0.95 : 1;
  return Math.round(j.pedido * fator * 10) / 10;
}
function negDigito(d) {
  if (d === "." && estado.neg.valor.includes(".")) return;
  if (estado.neg.valor.length >= 7) return;
  estado.neg.valor += d;
  renderModal();
}
function negApagar() { estado.neg.valor = estado.neg.valor.slice(0, -1); renderModal(); }
function negZerar() { estado.neg.valor = ""; renderModal(); }
function negPedido() {
  const j = estado.livres[estado.sel];
  if (j) estado.neg.valor = String(precoContrato(j, estado.neg.duracao));
  renderModal();
}
function negDuracao(m) { estado.neg.duracao = m; renderModal(); }
function negUnidade(u) { estado.neg.unidade = u; estado.neg.valor = ""; renderModal(); }
function negLuvas(x) { estado.neg.luvas = x; renderModal(); }

function enviarContrato() {
  const j = estado.livres[estado.sel];
  if (!j) return;
  const digitado = parseFloat(estado.neg.valor);
  const oferta = estado.neg.unidade === "milhao" ? Math.round(digitado * 1000 * 10) / 10 : digitado;
  if (!oferta || oferta <= 0) { mostrarToast("Digite o salário por rodada."); return; }
  const exigido = precoContrato(j, estado.neg.duracao);
  if (oferta < exigido) { mostrarToast(`${j.nome} recusou: quer pelo menos ${fmtMil(exigido)}/rodada.`); return; }
  const bonus = Math.round(oferta * estado.neg.luvas * 10) / 10;
  if (estado.meu.orcamento < bonus) { mostrarToast("Orçamento insuficiente para as luvas."); return; }
  if (estado.meu.elenco.length >= 60) { mostrarToast("Elenco cheio (máx. 60)."); return; }
  if (j.origem) {
    const o = estado.times.find(t => t.nome === j.origem);
    if (o && o.elenco.length <= 11) { mostrarToast(`${o.nome} não pode perder mais jogadores agora.`); return; }
  }
  estado.meu.orcamento = Math.round((estado.meu.orcamento - bonus) * 10) / 10;
  j.salario = oferta;
  j.contrato = { meses: estado.neg.duracao, luvas: bonus };
  if (j.origem) {
    const origem = estado.times.find(t => t.nome === j.origem);
    if (origem) origem.elenco = origem.elenco.filter(x => x.id !== j.id);
    delete j.origem;
  }
  estado.meu.elenco.push(j);
  estado.meu.escal = null;
  estado.livres.splice(estado.sel, 1);
  if (j.idade && j.idade <= 21) estado.contratadosBase++;
  postar(`${j.nome} assina por ${estado.neg.duracao} meses com o ${estado.meu.nome}.`, "contrato");
  estado.torcida = Math.min(100, estado.torcida + 2);
  mostrarTransferencia(j);
  fecharModal(true);
  mostrarToast(`${j.nome} assinou por ${fmtMil(oferta)}/rodada!`);
  render();
}

function renderRedes() {
  const t = estado.torcida;
  const humor = t >= 75 ? "Torcida em festa" : t >= 50 ? "Torcida animada" : t >= 30 ? "Torcida desconfiada" : "Torcida revoltada";
  const tags = { vitoria: "VITÓRIA", empate: "EMPATE", derrota: "DERROTA", contrato: "CONTRATAÇÃO", titulo: "TÍTULO", liga: "RODADA" };
  const posts = estado.feed.map(p => `
    <div class="post post-${p.tipo}">
      <span class="post-tag">${tags[p.tipo] || "RODADA"}</span>
      <p>${p.texto}</p>
      <small>${p.rod ? "Rodada " + p.rod : "Início"}</small>
      <div class="post-acoes">
        <button class="curtir ${p.curtiu ? "on" : ""}" onclick="curtirPost(${p.id})">♥ ${p.curtidas}</button>
        <span>${p.comentarios.length} comentários</span>
      </div>
      <div class="comentarios">
        ${p.comentarios.map(c => `<div class="comentario"><b>${c.autor}</b> ${c.texto}</div>`).join("")}
      </div>
    </div>`).join("");

  return `
    <div class="secao"><h2>Redes do ${estado.meu.nome}</h2><span>${humor}</span></div>
    <div class="card em-alta"><h4>Em alta</h4>${altaHtml}</div>

      <div class="torcida-topo"><span>Poder da torcida</span><b>${t}%</b></div>
      <div class="barra-torcida"><i style="width:${t}%"></i></div>
    </div>
    ${posts}
    <div class="secao" style="margin-top:18px"><h2>Jogadores</h2><span>entrevistas</span></div>
    ${renderComentJog()}`;
}

// Banco do clube: empréstimo com juros e parcelas por rodada
const JUROS_MES = 0.02;
function totalEmprestimo(v, meses) { return Math.round(v * (1 + JUROS_MES * meses) * 10) / 10; }
function pedirEmprestimo() {
  const b = estado.banco;
  if (estado.emprestimos.length >= 3) { mostrarToast("Você já tem 3 empréstimos ativos."); return; }
  const total = totalEmprestimo(b.valor, b.meses);
  const rodadas = b.meses * 4;
  const parcela = Math.round((total / rodadas) * 10) / 10;
  estado.meu.orcamento = Math.round((estado.meu.orcamento + b.valor) * 10) / 10;
  estado.emprestimos.push({ valor: b.valor, total, rodadas, restam: rodadas, parcela });
  mostrarToast(`Empréstimo de ${fmtMil(b.valor)} aprovado.`);
  render();
}
function pagarEmprestimos() {
  const meu = estado.meu;
  if (!meu) return;
  for (const e of estado.emprestimos) {
    meu.orcamento = Math.round((meu.orcamento - e.parcela) * 10) / 10;
    e.restam--;
  }
  estado.emprestimos = estado.emprestimos.filter(e => e.restam > 0);
}
function setBanco(campo, valor) { estado.banco[campo] = valor; render(); }

function renderBanco() {
  const b = estado.banco;
  const total = totalEmprestimo(b.valor, b.meses);
  const parcela = Math.round((total / (b.meses * 4)) * 10) / 10;
  const ativos = estado.emprestimos.map(e => `
    <div class="banco-item"><span>Parcela</span><span>${fmtMil(e.parcela)}/rod. · faltam ${e.restam} rodadas</span><b>${e.total}</b></div>`).join("");
  return `
    <div class="card neg-tela"><small>Saldo do clube</small><div class="neg-valor">${fmtMil(estado.meu.orcamento)}</div></div>
    <div class="neg-linha">${[500, 1000, 2000].map(v => `<button class="chip ${b.valor === v ? "on" : ""}" onclick="setBanco('valor', ${v})">${fmtMil(v)}</button>`).join("")}</div>
    <div class="neg-linha">${[6, 12, 24].map(m => `<button class="chip ${b.meses === m ? "on" : ""}" onclick="setBanco('meses', ${m})">${m} meses</button>`).join("")}</div>
    <p class="resumo" style="text-align:center;margin:10px 0">Você recebe ${fmtMil(b.valor)} e paga ${fmtMil(total)} em ${b.meses * 4} parcelas de ${fmtMil(parcela)} por rodada (juros de 2% ao mês).</p>
    <div class="botoes"><button class="primario" onclick="pedirEmprestimo()">Pegar empréstimo</button></div>
    ${ativos ? `<div class="secao" style="margin-top:14px"><h2>Empréstimos ativos</h2><span>${estado.emprestimos.length}/3</span></div>${ativos}` : '<p class="resumo" style="text-align:center">Nenhum empréstimo ativo.</p>'}`;
}

// Clube: mercado, banco e redes em um só lugar
function setClube(sub) { estado.subclube = sub; render(); }
function renderClube() {
  const sub = estado.subclube || "mercado";
  const abas = [["mercado", "Mercado"], ["base", "Base"], ["propostas", "Propostas" + (estado.propostas.length ? " (" + estado.propostas.length + ")" : "")], ["banco", "Banco"], ["redes", "Redes"]];
  const seg = `<div class="seg">${abas.map(([k, l]) => `<button class="${sub === k ? "on" : ""}" onclick="setClube('${k}')">${l}</button>`).join("")}</div>`;
  if (sub === "banco") return seg + renderBanco();
  if (sub === "redes") return seg + renderRedes();
  if (sub === "base") return seg + renderBase();
  if (sub === "propostas") return seg + renderPropostas();
  return seg + renderMercado();
}

    ${renderPatrocinios()}`;
}

// Central: próximo jogo e próximos compromissos
// Estado do jogo: captura e restauração (usado nas carreiras salvas e em "Nova carreira")
const CHAVES_ESTADO = ["times", "rodadas", "rodada", "livres", "sel", "escalSel", "escolhido", "compIdx", "comp", "concluidas",
  "campeaoBrasileiro", "velocidade", "comentJog", "planoComps", "semana", "agenda", "estat", "transferencias", "calMes", "dificuldade", "tecnico", "patrocinios", "patroAtivo", "base", "propostas", "contPropostas", "qualidadeBase", "feed", "torcida", "sequencia", "derrotasSeguidas", "contratadosBase", "emprestimos", "banco",
  "ultimaPartida", "subclube", "pais", "neg", "formacao", "subtab", "ultimaTela", "historico", "treinoBonus", "escalIdx"];
function capturarEstado() {
  const snap = {};
  for (const k of CHAVES_ESTADO) snap[k] = JSON.parse(JSON.stringify(estado[k] === undefined ? null : estado[k]));
  snap.meuIdx = estado.times.indexOf(estado.meu);
  snap.titulos = JSON.parse(JSON.stringify(TITULOS));
  snap.ids = [ID_JOGADOR, ID_POST];
  return snap;
}
function restaurarEstado(snap) {
  for (const k of CHAVES_ESTADO) estado[k] = JSON.parse(JSON.stringify(snap[k] === undefined ? null : snap[k]));
  estado.meu = estado.times[snap.meuIdx] || estado.times[0];
  for (const k of Object.keys(snap.titulos)) TITULOS[k] = JSON.parse(JSON.stringify(snap.titulos[k]));
  ID_JOGADOR = snap.ids[0];
  ID_POST = snap.ids[1];
  estado.reuniao = false;
  estado.celebrar = null;
  estado.pressPendente = false;
  estado.golPendente = null;
}

// Base de jovens: captação a cada 6 meses (24 rodadas), evolução a cada mês
function captarJovens(inicial) {
  for (let k = 0; k < 3; k++) {
    const q = estado.qualidadeBase || 0;
    const ovr = 44 + rnd(0, 10) + q;
    const pot = Math.min(82, ovr + rnd(10, 18) + q);
    estado.base.push({ id: ++ID_JOGADOR, nome: pick(NOMES) + " " + pick(SOBRENOMES), pos: pick(POSICOES), idade: rnd(16, 19), ovr, pot, salario: 2, pedido: 2 });
  }
  if (!inicial) { postar("Captação: 3 novos jovens chegaram à base.", "liga"); mostrarToast("Novos jovens na base."); }
}
function evoluirBase() {
  for (const j of estado.base) j.ovr = Math.min(j.pot, j.ovr + rnd(1, 3));
}
function promoverJovem(i) {
  const j = estado.base[i];
  if (!j) return;
  if (estado.meu.elenco.length >= 60) { mostrarToast("Elenco cheio (máx. 60)."); return; }
  estado.base.splice(i, 1);
  j.salario = Math.round((j.ovr - 45) * 1.5 * 10) / 10;
  j.pedido = j.salario;
  estado.meu.elenco.push(j);
  estado.meu.escal = null;
  postar(`${j.nome} subiu da base para o elenco.`, "contrato");
  render();
}
function dispensarJovem(i) { estado.base.splice(i, 1); render(); }
function melhorarBase() {
  if (estado.meu.orcamento < 500) { mostrarToast("Orçamento insuficiente (500 mil)."); return; }
  estado.meu.orcamento = Math.round((estado.meu.orcamento - 500) * 10) / 10;
  estado.qualidadeBase = (estado.qualidadeBase || 0) + 2;
  mostrarToast("Base melhorada: os próximos jovens virão melhores.");
  render();
}

  });

  estado.patrocinios = [];

function processarPatrocinio(venceu) {
  const pa = estado.patroAtivo;
  if (!pa || !estado.meu) return;
  estado.meu.orcamento = Math.round((estado.meu.orcamento + pa.pag) * 10) / 10;
  if (venceu) pa.progresso++;
  pa.restam--;
  if (pa.restam <= 0) {
    if (pa.progresso >= pa.meta) postar(`A ${pa.marca} cumpriu a meta. Bônus recebido.`, "vitoria");
    else { estado.meu.orcamento = Math.round((estado.meu.orcamento - pa.multa) * 10) / 10; postar(`A ${pa.marca} cobrou multa: meta não cumprida.`, "derrota"); }
    estado.patroAtivo = null;
  }
}

// Transferências entre outros clubes (aparecem em Clube → Mercado)
function transferenciasIA() {
  const clubes = estado.times.filter(t => !t.folga && t !== estado.meu);
  const origem = pick(clubes);
  if (origem.elenco.length <= 12) return;
  const cand = origem.elenco.filter(x => x.ovr >= 70 && !estado.livres.some(l => l.id === x.id));
  if (!cand.length) return;
  const j = pick(cand);
  const dest = pick(clubes.filter(t => t !== origem));
  origem.elenco = origem.elenco.filter(x => x.id !== j.id);
  dest.elenco.push(j);
  estado.transferencias.unshift({ jogador: j.nome, de: origem.nome, para: dest.nome, valor: Math.round((j.ovr - 40) * 12) });
  if (estado.transferencias.length > 8) estado.transferencias.pop();
}
function renderTransferencias() {
  if (!estado.transferencias.length) return "";
  const linhas = estado.transferencias.map(t => `
    <div class="res"><span>${t.jogador}</span><span>${t.de} → ${t.para}</span><span>${fmtMil(t.valor)}</span></div>`).join("");
  return `<div class="secao" style="margin-top:16px"><h2>Últimas transferências</h2><span>outros clubes</span></div>${linhas}`;
}

function gerarPropostas() {
  if (Math.random() > 0.3) return;
  const cand = estado.meu.elenco.filter(j => j.ovr >= 70);
  if (!cand.length) return;
  const j = pick(cand);
  const outros = estado.times.filter(t => !t.folga && t !== estado.meu);
  const valor = Math.round((j.ovr - 40) * 12 + Math.random() * 60);
  estado.contPropostas = (estado.contPropostas || 0) + 1;
  estado.propostas.push({ id: estado.contPropostas, jogadorId: j.id, jogadorNome: j.nome, clube: pick(outros).nome, valor });
  if (estado.propostas.length > 5) estado.propostas.shift();
  postar(`Proposta recebida por ${j.nome}.`, "contrato");
}
function aceitarProposta(pid) {
  const p = estado.propostas.find(x => x.id === pid);
  if (!p) return;
  if (estado.meu.elenco.length <= 11) { mostrarToast("Você precisa de pelo menos 11 jogadores."); return; }
  estado.meu.elenco = estado.meu.elenco.filter(x => x.id !== p.jogadorId);
  estado.meu.escal = null;
  estado.meu.orcamento = Math.round((estado.meu.orcamento + p.valor) * 10) / 10;
  estado.propostas = estado.propostas.filter(x => x.id !== pid);
  if ((estado.estat[p.jogadorId] || {}).gols >= 10) estado.torcida = Math.max(0, estado.torcida - 25);
  postar(`${p.jogadorNome} foi vendido ao ${p.clube} por ${fmtMil(p.valor)}.`, "contrato");
  mostrarToast(`Venda concluída: ${fmtMil(p.valor)}.`);
  render();
}
function recusarProposta(pid) {
  estado.propostas = estado.propostas.filter(x => x.id !== pid);
  render();
}

function reputacaoTreinador() {
  const x = TITULOS[estado.meu.nome] || { paulista: 0, carioca: 0, libertadores: 0, brasileiro: 0 };
  const titulos = x.paulista + x.carioca + x.libertadores + x.brasileiro;
  const nota = 4 + Math.min(3, titulos * 0.03) + estado.torcida * 0.025 + (estado.sequencia >= 3 ? 0.5 : 0);
  return Math.min(10, Math.round(nota * 10) / 10);
}

function renderJogos() {
  const eu = estado.meu;
  const idx = estado.times.indexOf(eu);

  // Próximo jogo
  let titulo, prox;
  if (estado.comp) {
    const rod = estado.comp.rodadas[estado.comp.idx] || [];
    const j = rod.find(([a, b]) => a === eu.nome || b === eu.nome);
    prox = j ? [estado.times.find(t => t.nome === j[0]), estado.times.find(t => t.nome === j[1])] : null;
    titulo = `${estado.comp.def.nome} · ${estado.comp.faseNome}`;
  } else {
    const rod = estado.rodadas[estado.rodada] || [];
    const j = rod.find(([c, f]) => c === idx || f === idx);
    prox = j ? [estado.times[j[0]], estado.times[j[1]]] : null;
    titulo = `Brasileiro · rodada ${Math.min(estado.rodada + 1, estado.rodadas.length)}`;
  }
  const ok = prox && !prox[0].folga && !prox[1].folga;
  const versus = ok
    ? `<div class="versus"><div class="lado">${escudo(prox[0])}</div><div class="x">x</div><div class="lado">${escudo(prox[1])}</div></div>`
    : `<p class="resumo" style="text-align:center">Sem jogo para o seu time agora (folga ou treino).</p>`;

  // Números do clube
  const forcaPct = Math.max(0, Math.min(100, Math.round(forca(eu))));
  const formacao = getEscal(eu, estado.formacao).formacao;
  const formacaoTxt = formacao ? NOME_FORMACAO[formacao] : "";
  const rep = reputacaoTreinador().toFixed(1).replace(".", ",");

  // Última partida
  const up = estado.ultimaPartida;
  const statsHtml = up ? `<div class="card stats-partida">
      <h4>Última partida · ${up.placar} vs ${up.adversario}</h4>
      <div class="stat-linha"><span>Posse de bola</span><b>${up.posse}% · ${100 - up.posse}%</b></div>
      <div class="barra-torcida"><i style="width:${up.posse}%"></i></div>
      <div class="stat-linha"><span>Chutes</span><b>${up.chutesSeu} · ${up.chutesAdv}</b></div>
      <div class="stat-linha"><span>Destaque</span><b>${up.destaque}</b></div>
    </div>` : "";

  // Desafios
  const desafios = [
    { t: "Vencer 3 jogos seguidos", atual: Math.min(estado.sequencia, 3), meta: 3 },
    { t: "Contratar 1 jogador da base", atual: Math.min(estado.contratadosBase, 1), meta: 1 },
    { t: "Torcida a 70%", atual: Math.min(estado.torcida, 70), meta: 70 }
  ];
  const desafiosHtml = desafios.map(d => {
    const pct = Math.round((d.atual / d.meta) * 100);
    return `<div class="desafio ${pct >= 100 ? "feito" : ""}">
      <div class="desafio-topo"><span>${d.t}</span><b>${pct >= 100 ? "Feito" : d.atual + "/" + d.meta}</b></div>
      <div class="barra-torcida"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join("");

  // Próximos jogos
  const proximos = [];
  if (!estado.comp) {
    for (let r = estado.rodada; r < Math.min(estado.rodadas.length, estado.rodada + 5); r++) {
      const j = (estado.rodadas[r] || []).find(([c, f]) => c === idx || f === idx);
      if (!j) continue;
      const a = estado.times[j[0]], b = estado.times[j[1]];
      if (a.folga || b.folga) { proximos.push(`<div class="res"><span>R${r + 1}</span><span>Treino</span><span></span><span></span></div>`); continue; }
      const adv = a === eu ? b : a;
      proximos.push(`<div class="res"><span>R${r + 1}</span><span style="display:flex;align-items:center;gap:8px">${escudo(adv)}${a === eu ? "Casa" : "Fora"}</span><span></span><span></span></div>`);
    }
  }

  // Clubes da liga
  const crestes = estado.times.filter(t => !t.folga).map(t =>
    `<div class="crest-item ${t === eu ? "eu" : ""}">${escudo(t)}</div>`).join("");

  return `
    <div class="dash">
      <div class="card dash-clube">
        <div class="clube-topo">${escudo(eu)}<div><h3>${eu.nome}</h3><small>${titulo}</small></div></div>
        <div class="clube-numeros">
          <div><span>Orçamento</span><b>${fmtMil(eu.orcamento)}</b></div>
          <div><span>Reputação</span><b>${rep}/10</b></div>
          <div><span>Formação</span><b>${formacaoTxt}</b></div>
        </div>
      </div>

      <div class="card dash-proximo">
        <h4>Próximo jogo</h4>
        ${versus}
        <div class="forca-linha"><span>Força do time</span><b>${forcaPct}%</b></div>
        <div class="barra-torcida"><i style="width:${forcaPct}%"></i></div>
        <div class="botoes" style="margin-top:12px"><button class="primario" onclick="preJogo()">Jogar ▶</button></div>
      </div>

      ${statsHtml ? statsHtml.replace('class="card stats-partida"', 'class="card stats-partida dash-stats"') : ""}

      <div class="card desafios dash-desafios"><h4>Desafios</h4>${desafiosHtml}</div>

      ${proximos.length ? `<div class="card dash-proximos"><h4>Próximos jogos</h4>${proximos.join("")}</div>` : ""}
    </div>`;
}

const COMPAT = {
  GOL: [], LAT: ["ZAG","MEI"], ZAG: ["LAT","VOL"], VOL: ["MEI","ZAG"],
  MEI: ["VOL","PON","ATA"], PON: ["ATA","MEI"], ATA: ["PON","MEI"]
};

function escalar(elenco, formacao) {
  const restantes = [...elenco].sort((a, b) => b.ovr - a.ovr);
  const usados = new Set();
  const livre = pos => restantes.find(j => !usados.has(j.id) && j.pos === pos);
  const titulares = FORMACOES[formacao].map(slot => {
    let jog = livre(slot.pos);
    if (!jog) for (const alt of COMPAT[slot.pos] || []) { jog = livre(alt); if (jog) break; }
    if (!jog) jog = restantes.find(j => !usados.has(j.id)) || null;
    if (jog) usados.add(jog.id);
    return { slot, jog };
  });
  const banco = restantes.filter(j => !usados.has(j.id));
  return { titulares, banco };
}

// Escalação manual: guarda os 11 titulares do seu time (ids dos jogadores por posição do campo)
function getEscal(t, formacao) {
  const valido = t.escal && t.escal.formacao === formacao &&
    t.escal.ids.every(id => id == null || t.elenco.some(j => j.id === id));
  if (!valido) {
    const { titulares } = escalar(t.elenco, formacao);
    t.escal = { formacao, ids: titulares.map(x => (x.jog ? x.jog.id : null)) };
  }
  return t.escal;
}

function escalarToque(tipo, valor) {
  const t = estado.meu;
  const e = getEscal(t, estado.formacao);
  const sel = estado.escalSel;
  const igual = sel && sel.tipo === tipo && (tipo === "t" ? sel.slot === valor : sel.id === valor);
  if (igual) { estado.escalSel = null; return render(); }
  if (!sel) {
    estado.escalSel = tipo === "t" ? { tipo: "t", slot: valor } : { tipo: "b", id: valor };
  } else if (sel.tipo === "t" && tipo === "t") {
    const a = sel.slot;
    [e.ids[a], e.ids[valor]] = [e.ids[valor], e.ids[a]];
    estado.escalSel = null;
  } else if (sel.tipo === "t" && tipo === "b") {
    e.ids[sel.slot] = valor;
    estado.escalSel = null;
  } else if (sel.tipo === "b" && tipo === "t") {
    e.ids[valor] = sel.id;
    estado.escalSel = null;
  } else {
    estado.escalSel = null;
  }
  render();
}

function renderEscalacao() {
  const t = estado.meu;
  const e = getEscal(t, estado.formacao);
  const porId = Object.fromEntries(t.elenco.map(j => [j.id, j]));
  const titulares = FORMACOES[estado.formacao].map((slot, i) => ({ slot, i, jog: e.ids[i] != null ? porId[e.ids[i]] : null }));
  const banco = t.elenco.filter(j => !e.ids.includes(j.id)).sort((a, b) => b.ovr - a.ovr);
  const sel = estado.escalSel;
  const chipsForm = Object.keys(FORMACOES).map(f =>
    `<button class="chip ${estado.formacao === f ? "on" : ""}" onclick="escolherForm('${f}')">${NOME_FORMACAO[f]}</button>`).join("");
  const pinos = titulares.map(({ slot, i, jog }) => {
    const marcado = sel && sel.tipo === "t" && sel.slot === i ? " sel" : "";
    return `<div class="pino${marcado}" style="left:${slot.x}%;top:${slot.y}%" onclick="escalarToque('t', ${i})">
        ${jog ? `${camisa(estado.meu, jog.camisa || (i + 1), ovrNoSlot(jog, slot.pos))}<span>${jog.nome}</span>`
              : `<div class="bolinha fraco">+</div><span>vazio</span>`}
      </div>`;
  }).join("");
  const bancoHtml = banco.map(j => {
    const marcado = sel && sel.tipo === "b" && sel.id === j.id ? " sel" : "";
    return `<div class="banco-item${marcado}" onclick="escalarToque('b', ${j.id})"><span>${j.pos}</span><span>${j.nome}</span><b>${j.ovr}</b></div>`;
  }).join("");
  return `
    <div class="chips">${chipsForm}</div>
    <p class="dica-troca">Toque em um jogador do campo e depois em outro para trocar. Toque em um reserva e depois em um titular para substituir.</p>
    <div class="campo"><div class="area area-sup"></div><div class="area area-inf"></div>${pinos}</div>
    <div class="secao"><h2>Banco</h2><span>${banco.length} jogadores</span></div>
    ${bancoHtml || '<p class="resumo">Sem reservas.</p>'}
    <p class="nota-rodape">Ao trocar de formação, a escalação volta para a sugestão automática.</p>`;
}

// Atributos do jogador, derivados do overall e da posição (com pequena variação fixa por jogador)
const ATRIBUTOS = ["Finalização", "Defesa", "Passe", "Velocidade", "Físico", "Fôlego", "Goleiro", "Apoio ofensivo"];
function atributos(j) {
  const base = { GOL: [-40, -40, -30, -30, -10, -10, 14, -40], ZAG: [-25, 10, -10, -5, 8, 4, -40, -30], LAT: [-18, 2, 0, 6, 2, 8, -40, -6],
    VOL: [-14, 6, 2, -4, 6, 6, -40, -10], MEI: [-6, -8, 8, 0, -2, 2, -40, 4], PON: [-2, -20, 2, 8, -4, 4, -40, 8], ATA: [8, -28, -6, 6, 2, 0, -40, 6] }[j.pos] || [0, 0, 0, 0, 0, 0, -40, 0];
  const seed = (j.id * 9301 + 49297) % 233280;
  return ATRIBUTOS.map((nome, i) => {
    const ruido = ((seed * (i + 3)) % 11) - 5;
    const v = Math.round(Math.max(1, Math.min(99, j.ovr + base[i] + ruido)));
    return [nome, v];
  });
}
function perfilJogadorHtml(j) {
  const e = (estado.estat || {})[j.id] || { gols: 0 };
  const idolo = e.gols >= 10;
  return `<div class="perfil-jog">
    ${idolo ? '<span class="base-tag">ÍDOLO</span>' : ""}
    <p class="resumo" style="margin:8px 0 0">Gols pelo ${estado.meu.nome}: <b>${e.gols}</b></p>
    ${idolo ? '<p class="resumo" style="color:#fdba74;margin:6px 0 0">Vender um ídolo custa −25 de apoio da torcida.</p>' : ""}
  </div>`;
}
function atributosHtml(j) {
  const linhas = atributos(j).map(([n, v]) => `
    <div class="attr"><span>${n}</span><div class="attr-barra"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join("");
  const potencial = j.pot ? `<p class="resumo" style="margin:10px 0 0">Potencial: <b>oculto</b></p>` : "";

    <path d="M14 10v12" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    ${selo}
    <path d="M17.8 32h4.4l1.2 9.5h-6.8z" fill="${cor}"/>

  return `<span class="taca">${svg}${etiqueta}</span>`;
}

function prateleira(rotulo, tipo, n, anos) {
