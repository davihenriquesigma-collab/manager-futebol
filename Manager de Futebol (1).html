// Calendário mensal estilo FIFA: cada rodada cai numa semana a partir de 07/01/2026
const MESES_PT = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
function dataRodada(i) { const d = new Date(2026, 0, 7); d.setDate(d.getDate() + i * 7); return d; }
function setCalMes(delta) { estado.calMes = (estado.calMes || 0) + delta; render(); }
function dataSemana(w) { const d = new Date(2026, 0, 7); d.setDate(d.getDate() + w * 7); return d; }
function renderCalendarioMes() {
  const eu = estado.meu;
  const idx = estado.times.indexOf(eu);
  const sem = estado.semana || 0;
  const hoje = dataSemana(sem);
  const ref = new Date(hoje.getFullYear(), hoje.getMonth() + (estado.calMes || 0), 1);
  const ano = ref.getFullYear(), mes = ref.getMonth();
  const noMes = (d) => d.getFullYear() === ano && d.getMonth() === mes;
  const porDia = {};
  // jogos já disputados (todas as competições)
  (estado.agenda || []).forEach(a => {
    const d = dataSemana(a.semana);
    if (!noMes(d)) return;
    const casa = a.casa === eu.nome;
    const adv = casa ? a.fora : a.casa;
    const meus = casa ? a.gc : a.gf, deles = casa ? a.gf : a.gc;
    porDia[d.getDate()] = { tipo: "feito", adv, casa, placar: `${a.gc} x ${a.gf}`, res: meus > deles ? "v" : meus === deles ? "e" : "d", comp: a.comp };
  });
  // próximos jogos: competições ainda não disputadas e Brasileiro, uma rodada por semana
  const rodadasFuturas = [];
  if (estado.comp) for (let r = estado.comp.idx; r < estado.comp.rodadas.length; r++) rodadasFuturas.push({ rod: estado.comp.rodadas[r], nomes: true, comp: estado.comp.def.abrev });
  for (let c = (estado.compIdx || 0) + 1; c < COMPETICOES.length; c++) {
    const def = COMPETICOES[c];
    ((estado.planoComps && estado.planoComps[def.id]) || []).forEach(rod => rodadasFuturas.push({ rod, nomes: true, comp: def.abrev }));
  }
  for (let r = estado.rodada; r < estado.rodadas.length; r++) rodadasFuturas.push({ rod: estado.rodadas[r], nomes: false, comp: "Brasileiro" });
  rodadasFuturas.slice(0, 60).forEach((item, k) => {
    const w = sem + 1 + k;
    const d = dataSemana(w);
    if (!noMes(d) || porDia[d.getDate()]) return;
    const par = (item.rod || []).find(p => {
      const a = item.nomes ? p[0] : estado.times[p[0]].nome;
      const b = item.nomes ? p[1] : estado.times[p[1]].nome;
      return a === eu.nome || b === eu.nome;
    });
    if (!par) return;
    const a = item.nomes ? par[0] : estado.times[par[0]].nome;
    const b = item.nomes ? par[1] : estado.times[par[1]].nome;
    const casa = a === eu.nome;
    porDia[d.getDate()] = { tipo: "futuro", adv: casa ? b : a, casa, comp: item.comp };
  });
  const n = new Date(ano, mes + 1, 0).getDate();
  const off = new Date(ano, mes, 1).getDay();
  let celulas = "";
  for (let k = 0; k < off; k++) celulas += '<div class="dia vazio"></div>';
  for (let d = 1; d <= n; d++) {
    const j = porDia[d];
    const eHoje = noMes(hoje) && hoje.getDate() === d;
    if (!j) { celulas += `<div class="dia ${eHoje ? "atual" : ""}"><b>${d}</b></div>`; continue; }
    const adv = estado.times.find(t => t.nome === j.adv) || j.adv;
    const escudoAdv = typeof adv === "object" ? escudo(adv) : "";
    if (j.tipo === "feito") {
      celulas += `<div class="dia jogo res-${j.res} ${eHoje ? "atual" : ""}"><b>${d}</b>${escudoAdv}<small>${j.placar}</small></div>`;
    } else {
      celulas += `<div class="dia jogo futuro ${eHoje ? "atual" : ""}"><b>${d}</b>${escudoAdv}<small>${j.casa ? "CASA" : "FORA"}</small></div>`;
    }
  }
  return `
    <div class="secao"><h2>Calendário</h2><span>${estado.rodadas.length} rodadas</span></div>
    <div class="cal-topo"><button class="chip" onclick="setCalMes(-1)">‹</button><b>${MESES_PT[mes]} ${ano}</b><button class="chip" onclick="setCalMes(1)">›</button></div>
    <div class="cal-semana">${["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"].map(x => `<span>${x}</span>`).join("")}</div>
    <div class="cal-grade">${celulas}</div>`;
}

function renderCalendario() {
  const eu = estado.meu;
  const idx = estado.times.indexOf(eu);
  const linhas = estado.rodadas.map((r, i) => {
    const jogo = r.find(([c, f]) => c === idx || f === idx);
    if (!jogo) return "";
    const [c, f] = jogo;
    const a = estado.times[c], b = estado.times[f];
    const atual = i === estado.rodada ? " atual" : "";
    if (a.folga || b.folga) {
      return `<div class="res${atual}"><span>R${i + 1}</span><span>Treino</span><span></span><span></span></div>`;
    }
    const casa = a === eu;
    const adv = casa ? b : a;
    const h = estado.historico.find(x => x.rodada === i + 1 && (x.casa === eu.nome || x.fora === eu.nome));
    let placar = "", cls = "";
    if (h) {
      const euCasa = h.casa === eu.nome;
      const meus = euCasa ? h.gc : h.gf, deles = euCasa ? h.gf : h.gc;
      placar = `${h.gc} x ${h.gf}`;
      cls = meus > deles ? "v" : meus === deles ? "e" : "d";
    }
    const letra = cls === "v" ? "V" : cls === "e" ? "E" : cls === "d" ? "D" : "";
    return `<div class="res${atual}">
      <span>R${i + 1}</span>
      <span style="display:flex;align-items:center;gap:8px">${escudo(adv)}<small style="color:var(--grey)">${casa ? "Casa" : "Fora"}</small></span>
      <span class="placar">${placar || "—"}</span>
      <span class="r ${cls}">${letra}</span>
    </div>`;
  }).join("");
  return `
    <div class="secao" style="margin-top:18px"><h2>Calendário</h2><span>${estado.rodadas.length} rodadas</span></div>
    ${linhas}`;
}

function renderClassificacao() {
  const ord = estado.times.filter(t => !t.folga)
    .sort((a, b) => (b.pts - a.pts) || ((b.gf - b.ga) - (a.gf - a.ga)));
  const linhas = ord.map((t, i) => `
    <div class="tab-l ${t === estado.meu ? "eu" : ""}">
      <span class="pos-n ${i < 3 ? "t3" : ""}">${i + 1}</span>
      <div class="nome-clube">${escudo(t)}<span>${t.nome}</span></div>
      <span class="n">${t.jg}</span>
      <span class="n">${t.gf - t.ga}</span>
      <span class="p">${t.pts}</span>
    </div>`).join("");
  return `
    <div class="secao"><h2>Classificação</h2><span>turno e returno</span></div>
    <div class="tab">
      <div class="tab-l head"><span>#</span><span>Time</span><span class="n">J</span><span class="n">SG</span><span class="p">PTS</span></div>
      ${linhas}
    </div>`;
}

// Animação de título: troféu, confete e botão para continuar
function mostrarCelebracao() {
  const c = estado.celebrar;
  const el = $("celebracao");
  if (!el || !c) return;
  const confetes = Array.from({ length: 36 }, (_, i) => {
    const cores = ["#fbbf24", "#34d399", "#22d3ee", "#f87171", "#ffffff"];
    const x = (i * 97) % 100, atraso = (i % 9) * 0.25, dur = 2.4 + (i % 5) * 0.4;
    return `<span class="confete" style="left:${x}%;background:${cores[i % cores.length]};animation-delay:${atraso}s;animation-duration:${dur}s"></span>`;
  }).join("");
  el.innerHTML = `
    ${confetes}
    <div class="celebra-trofeu">${taca("brasileiro", String(c.ano))}</div>
    <div class="celebra-titulo">CAMPEÃO BRASILEIRO</div>
    <div class="celebra-time">${c.campeao}</div>
    <button class="primario celebra-botao" onclick="fecharCelebracao()">Continuar</button>`;
  el.classList.add("on");
}
function mostrarTransferencia(j) {
  const el = $("celebracao");
  if (!el) return;
  el.innerHTML = `
    <div class="transf-titulo">TRANSFERÊNCIA CONCLUÍDA</div>
    <div class="transf-linha">
      <div class="transf-clube"><div class="transf-sem">Sem clube</div></div>
      <div class="transf-seta">➜</div>
      <div class="transf-clube">${escudo(estado.meu)}</div>
    </div>
    <div class="celebra-time">${j.nome}</div>
    <div class="transf-info">${fmtMil(j.salario)}/rod. · ${j.contrato ? j.contrato.meses + " meses" : ""}</div>
    <button class="primario celebra-botao" onclick="fecharTransferencia()">Continuar</button>`;
  el.classList.add("on");
}
function fecharTransferencia() {
  const el = $("celebracao");
  if (el) { el.classList.remove("on"); el.innerHTML = ""; }
}

function fecharCelebracao() {
  estado.celebrar = null;
  const el = $("celebracao");
  if (el) { el.classList.remove("on"); el.innerHTML = ""; }
  render();
}

function render() {
  const meu = estado.meu;
  $("escudoMeu").innerHTML = escudo(meu);
  $("nomeTime").textContent = meu.nome;
  $("subtitulo").textContent = `Força ${forca(meu).toFixed(1)}`;
  const total = estado.rodadas.length;
  $("rodadaChip").textContent = estado.comp
    ? `${estado.comp.def.abrev} · ${estado.comp.faseNome}`
    : `Rodada ${Math.min(estado.rodada + 1, total)}/${total}`;
  $("orcamento").textContent = `Orçamento ${fmtMil(meu.orcamento)}`;
  $("barraOrc").style.width = `${Math.max(0, Math.min(100, meu.orcamento / 25))}%`;

  for (const t of ["jogos", "elenco", "clube", "tabela", "manager"]) {
    $("t-" + t).classList.toggle("on", estado.tela === t);
  }
  const conteudo = estado.tela === "inicio" ? renderInicio()
    : estado.tela === "aovivo" ? estado.aoVivoHtml
    : estado.tela === "paises_inicio" ? renderPaisesInicio()
    : estado.tela === "carreiras" ? renderCarreiras()
    : estado.tela === "tecnico" ? renderTecnico()
    : estado.tela === "manager" ? renderManager()
    : estado.tela === "calendario" ? renderCalendarioMes()
    : estado.tela === "patrocinio_inicio" ? renderPatrocinioInicio()
    : estado.tela === "escolha" ? renderEscolha()
    : estado.tela === "elenco" ? renderElenco()
    : estado.tela === "jogos" ? renderJogos()
    : estado.tela === "clube" ? renderClube()
    : estado.tela === "mercado" ? renderMercado()
    : renderTabela();
  document.body.classList.toggle("inicio", estado.tela === "inicio");
  aplicarLayout();
  document.body.classList.toggle("semtime", !estado.escolhido && estado.tela !== "inicio");
  if (estado.reuniao) mostrarReuniao();
  else if (estado.golPendente) mostrarGol();
  else if (estado.pressPendente && !estado.comp) mostrarImprensa();
  if (estado.celebrar) mostrarCelebracao();
  const mudouTela = estado.tela !== estado.ultimaTela;
  estado.ultimaTela = estado.tela;
  $("conteudo").classList.toggle("anima", mudouTela);
  $("conteudo").innerHTML = conteudo;
}

estado.slots = lerSlots();
gerarPlanoComps();
iniciarComp(0);
captarJovens(true);
ESTADO_INICIAL = capturarEstado();
render();
carregarElencosAPI();
</script>
